[project]
name = "open-assembly-cad"
version = "0.1.0"
description = "Skill-first mechanical reconstruction with editable CAD and assembly STEP"
requires-python = ">=3.13,<3.15"
dependencies = [
  "build123d==0.13.0",
  "trimesh>=4.8,<5",
  "pillow>=11,<14",
  "numpy>=2,<3",
  "scipy>=1.15,<2",
  "pydantic>=2.11,<3",
  "fastapi>=0.115,<1",
  "uvicorn>=0.34,<1",
  "python-multipart>=0.0.20,<1",
  "mcp>=1.20,<2",
  "specify-core==0.1.7",
]

[dependency-groups]
dev = ["pytest>=8,<10", "httpx>=0.28,<1", "ruff>=0.12,<1"]

[project.scripts]
open-skyfall = "open_assembly.cli:main"
open-assembly = "open_assembly.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["runtime/open_assembly"]

[tool.hatch.build.targets.wheel.force-include]
"web/dist" = "open_assembly/web_dist"
"examples/decomposition" = "open_assembly/data/decomposition"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py313"
line-length = 100
